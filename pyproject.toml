[project]
name = "arbscan"
version = "0.1.0"
description = "Read-only Kalshi <-> Polymarket US arbitrage scanner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "websockets>=13",
    "cryptography>=42",
    "orjson>=3.9",
    "uvloop>=0.19; sys_platform != \"win32\"",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arbscan = "arbscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arbscan*"]

[tool.setuptools.package-data]
arbscan = ["web/static/*", "web/static/*/*", "web/static/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
