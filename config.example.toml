# Copy to config.toml and edit. Every key is optional; these are the defaults.
# Plain keys must come before the first [[auto_approve]] table: TOML puts any key
# written after a table header inside that table.

db_path = "data/arbscan.db"
pairs_path = "pairs.csv"

# Streaming (lowest latency). With API keys for both venues, the scanner keeps
# live order books from their WebSocket feeds and prices each pair the moment
# either side changes. Without them it polls (below). Keep these files private.
# kalshi_key_id = "a952bcbe-..."                          # Kalshi: Account > API Keys
# kalshi_private_key_path = "~/.config/arbscan/kalshi.key"  # the file Kalshi downloaded
# pmus_key_id = "..."                                     # polymarket.us/developer
# pmus_secret_key = "..."                                 # shown once when you create the key

# Polling (no keys): start a sweep this often. Each sweep costs ~1 Kalshi and ~1
# Polymarket US request per 100 pairs, fetched together so both sides of a pair
# are priced from the same moment.
poll_interval_s = 1.0

# REST requests per second per venue. Both public APIs sustained 20/s in testing.
kalshi_rps = 15.0
pmus_rps = 15.0

# Only count contract pairs whose marginal profit after both taker fees is above
# this many dollars (0.01 = 1c per $1 pair).
min_edge = 0.0

# Your total bankroll in dollars, assumed split evenly across the two venues (each
# leg is paid for on its own venue). Every window is sized to what that buys, and
# the dashboard simulates one bankroll: windows taken in order, stakes tied up until
# the market resolves, skipping windows open less than sim_min_window_s or returning
# less than sim_min_annualized_return a year. 0 = unlimited (full book depth).
# Changing it re-sizes recorded history at the next start.
bankroll_usd = 500.0
sim_min_window_s = 1.0
sim_min_annualized_return = 0.10

# If you qualify for Polymarket US's volume rebate on taker fees (10/25/50%).
pmus_taker_rebate = 0.0

# Dashboard (`arbscan serve`). 0.0.0.0 makes it reachable from other devices on
# your network; use 127.0.0.1 to keep it local to the Pi. Set web_token to require
# opening the dashboard once with ?token=<value> (it then sets a cookie).
web_host = "0.0.0.0"
web_port = 8787
web_token = ""

# How often `arbscan serve` re-downloads the catalog, re-runs matching and (with a
# Jev key) reviews new suggestions. A refresh takes ~2 minutes at low priority.
refresh_interval_h = 1.0

# Live discovery: between refreshes, check each venue for newly listed markets this
# often (seconds) and match, review and pair them straight away.
discovery = true
kalshi_discovery_s = 15.0
pmus_discovery_s = 30.0

# Catalog/matching: ignore markets resolving further out than this, and
# suggestions scoring below this.
catalog_horizon_days = 120
match_min_score = 0.45

# Automatic review with TypeSafe's Jev model (see README). Set a key to turn it on;
# TYPESAFE_API_KEY in the environment also works. Keep this file private
# (chmod 600): it is git-ignored.
# jev_api_key = "apikey_..."
# jev_model = "jev-1.13.0"     # the thresholds in arbscan/jev.py were tuned on this version
# jev_rps = 8.0                # the API allows 1,200 requests/minute
# jev_max_per_run = 10000      # a cap on requests per refresh, as a cost guard

# Auto-approve rules: for templated markets whose rulebooks you've compared once
# by hand, approve every confident, mutual-best match between a Kalshi series and a
# Polymarket US slug prefix. Games are listed daily, so without rules like these
# you'd review each one. Inverse pairs (Kalshi "B wins" vs Polymarket "A wins")
# only hedge when the event can't end another way; set allow_inverse = false for
# sports with draws unless both venues settle draws the same way.
#
# [[auto_approve]]
# kalshi_series = "KXMLBGAME"      # MLB game winner
# pm_slug_prefix = "aec-mlb-"
# min_score = 0.6
# allow_inverse = true
#
# [[auto_approve]]
# kalshi_series = "KXMLBSPREAD"    # MLB run line
# pm_slug_prefix = "asc-mlb-"
