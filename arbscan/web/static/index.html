<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arbscan</title>
  <meta name="description" content="Read-only Kalshi / Polymarket US arbitrage scanner dashboard" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232a78d6'/%3E%3Ccircle cx='12.5' cy='16' r='6.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='19.5' cy='16' r='6.5' fill='none' stroke='white' stroke-width='2.2' opacity='.65'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try {
      const t = JSON.parse(localStorage.getItem("arbscan:theme") || '"system"');
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>arbscan's dashboard needs JavaScript.</noscript>
</body>
